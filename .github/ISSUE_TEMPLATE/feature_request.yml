name: Feature or change
description: Something the app should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or impossible today, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead. Sketch the UI or command line if it helps.
  - type: textarea
    id: notes
    attributes:
      label: Constraints
      description: Anything it must not break (deploy flow, data on the PVC, phone layout, legal or ToS limits).
